<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        #btn {
            padding: 14px 36px;
            font-size: 18px;
            color: white;
            background: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #btn:hover {
            background: #4338ca;
        }

        #btn:active {
            transform: scale(0.95);
        }

        #btn.clicked {
            background: #16a34a;
        }

        #count {
            margin-top: 16px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <button id="btn">Click Me</button>
    <p id="count">Clicked 0 times</p>

    <!-- Script at the end so the button exists before button.js runs -->
    <script src="button.js"></script>
</body>
</html>
