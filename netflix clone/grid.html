<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Board</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #1e1e24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f3f4f6;
      gap: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Board Frame */
    .board-wrapper {
      padding: 16px;
      background: #4a3525;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      border: 4px solid #2e2016;
    }

    /* 8x8 Chess Grid Container */
    .container {
      display: grid;
      grid-template-columns: repeat(8, 64px);
      grid-template-rows: repeat(8, 64px);
      border: 2px solid #2e2016;
    }

    /* Square base styling */
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      user-select: none;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    .square:hover {
      filter: brightness(1.15);
      z-index: 1;
    }

    /* Alternating Light and Dark squares */
    .light {
      background-color: #eedc97;
    }

    .dark {
      background-color: #966742;
    }

    /* Piece Colors */
    .white-piece {
      color: #ffffff;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.7));
    }

    .black-piece {
      color: #1a1a1a;
      filter: drop-shadow(0 2px 2px rgba(255, 255, 255, 0.3));
    }

    /* Responsive scaling for smaller screens */
    @media (max-width: 600px) {
      .container {
        grid-template-columns: repeat(8, 11vw);
        grid-template-rows: repeat(8, 11vw);
      }
      .square {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="board-wrapper">
    <div class="container">
      <!-- Row 8 (Black Major Pieces) -->
      <div class="square light black-piece">&#9820;</div>
      <div class="square dark black-piece">&#9822;</div>
      <div class="square light black-piece">&#9821;</div>
      <div class="square dark black-piece">&#9819;</div>
      <div class="square light black-piece">&#9818;</div>
      <div class="square dark black-piece">&#9821;</div>
      <div class="square light black-piece">&#9822;</div>
      <div class="square dark black-piece">&#9820;</div>

      <!-- Row 7 (Black Pawns) -->
      <div class="square dark black-piece">&#9823;</div>
      <div class="square light black-piece">&#9823;</div>
      <div class="square dark black-piece">&#9823;</div>
      <div class="square light black-piece">&#9823;</div>
      <div class="square dark black-piece">&#9823;</div>
      <div class="square light black-piece">&#9823;</div>
      <div class="square dark black-piece">&#9823;</div>
      <div class="square light black-piece">&#9823;</div>

      <!-- Row 6 (Empty) -->
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>

      <!-- Row 5 (Empty) -->
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>

      <!-- Row 4 (Empty) -->
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>

      <!-- Row 3 (Empty) -->
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>
      <div class="square dark"></div>
      <div class="square light"></div>

      <!-- Row 2 (White Pawns) -->
      <div class="square light white-piece">&#9817;</div>
      <div class="square dark white-piece">&#9817;</div>
      <div class="square light white-piece">&#9817;</div>
      <div class="square dark white-piece">&#9817;</div>
      <div class="square light white-piece">&#9817;</div>
      <div class="square dark white-piece">&#9817;</div>
      <div class="square light white-piece">&#9817;</div>
      <div class="square dark white-piece">&#9817;</div>

      <!-- Row 1 (White Major Pieces) -->
      <div class="square dark white-piece">&#9814;</div>
      <div class="square light white-piece">&#9816;</div>
      <div class="square dark white-piece">&#9815;</div>
      <div class="square light white-piece">&#9813;</div>
      <div class="square dark white-piece">&#9812;</div>
      <div class="square light white-piece">&#9815;</div>
      <div class="square dark white-piece">&#9816;</div>
      <div class="square light white-piece">&#9814;</div>
    </div>
  </div>
</body>
</html>
